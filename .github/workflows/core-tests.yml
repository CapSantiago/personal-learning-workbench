name: Core tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-server.lock.txt
      - run: python -m pip install -r requirements-server.lock.txt
      - run: python -B -m pytest tests/test_private_auth.py tests/test_private_assets.py tests/test_ui_theme.py tests/test_pdf_environment.py -q
